<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EquiSight AI — Loan Fairness Auditor</title>

  <!-- Google Fonts: Syne (display) + DM Mono (data/code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --border-hi: rgba(255,255,255,0.18);
      --accent: #00e5c3;
      --accent-dim: rgba(0,229,195,0.12);
      --text-hi: #f0f0f0;
      --text-mid: #a0a0b0;
      --radius: 16px;
      --blur: blur(18px) saturate(160%);
      --glow: 0 0 32px rgba(0,229,195,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background: var(--bg);
      color: var(--text-hi);
      font-family: 'Syne', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient background orbs */
    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, #00e5c3, transparent 70%);
      top: -200px; left: -150px;
      filter: blur(100px);
      opacity: 0.15;
      z-index: -1;
    }

    .glass {
      background: var(--surface);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .auth-card {
      padding: 48px 56px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    .auth-logo {
      width: 56px; height: 56px;
      margin: 0 auto 24px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--glow);
    }

    h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
    h1 span { color: var(--accent); }
    p { font-size: 0.88rem; color: var(--text-mid); margin-bottom: 36px; line-height: 1.6; }

    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 14px 24px;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 10px;
      color: var(--text-hi);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-google:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--glow);
    }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="glass auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
        <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>
      </svg>
    </div>
    <h1>Equi<span>Sight</span> AI</h1>
    <p>Audit your lending decisions for algorithmic bias.<br/>Powered by Gemini · SDG 10 · Firebase.</p>
    
    <!-- This is the clean, single working button -->
    <a href="/dashboard/" class="btn-google">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </a>
  </div>
</div>

</body>
</html>
